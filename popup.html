<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hostinger Reply Alias Fix</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1d2330; --muted:#667085; --line:#e4e7ec; --card:#f6f7f9; --accent:#5b3fd1; --green:#1a9d52; --amber:#d98a00; --grey:#98a2b3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1d24; --fg:#e7e9ee; --muted:#9aa3b2; --line:#2d323d; --card:#242831; --accent:#9b87f5; } }
  * { box-sizing: border-box; }
  body { width: 360px; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, sans-serif; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .status { display: flex; gap: 8px; align-items: flex-start; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex: none; background: var(--grey); }
  .dot.green { background: var(--green); } .dot.amber { background: var(--amber); }
  .muted { color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 3px 0; overflow-wrap: anywhere; }
  li + li { border-top: 1px solid var(--line); }
  .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  select, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  select { width: 100%; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.link { border: 0; background: none; color: var(--accent); padding: 0; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .row.end { justify-content: space-between; }
  .saved { color: var(--green); }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button { flex: 1; }
</style>
</head>
<body>
  <h1>Hostinger Reply Alias Fix</h1>

  <h2>This tab</h2>
  <div class="card status"><span id="dot" class="dot"></span><div id="tabState">Checking...</div></div>

  <h2>Identities learned</h2>
  <div class="card" id="identities">Loading...</div>

  <h2>Default for new messages</h2>
  <div class="card">
    <div class="muted">Current: <span id="defaultCurrent">...</span></div>
    <div class="row"><select id="defaultSelect" disabled></select></div>
    <div class="row end"><button class="link" id="moreOptions">More options</button><span id="saved" class="saved"></span></div>
  </div>

  <h2>Recent activity</h2>
  <div class="card" id="activity">Loading...</div>

  <div class="actions">
    <button id="rescan" disabled>Rescan open composers</button>
    <button id="reload" disabled>Reload tab</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
